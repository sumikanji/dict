<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muji Kanji v34.5 - Sound & Print</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --muji-bg: #f9f8f6;
            --muji-white: #ffffff;
            --muji-text: #2d2d2d;
            --muji-gray: #757575;
            --muji-border: #e8e4de;
            --muji-accent: #8b2e2b;
            --radius: 12px;
        }

        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: var(--muji-bg); color: var(--muji-text); margin: 0; -webkit-font-smoothing: antialiased; }
        .page { max-width: 900px; margin: 0 auto; padding: 40px 20px; display: none; }
        .active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* UI ELEMENTS */
        .muji-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1.5px solid var(--muji-border); padding-bottom: 25px; }
        .muji-header h2 { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: 5px; font-size: 26px; margin:0; }
        
        .btn-muji { 
            background: none; border: 1.5px solid var(--muji-border); color: var(--muji-gray); 
            padding: 10px 22px; border-radius: var(--radius); font-size: 11px; letter-spacing: 1.2px; 
            cursor: pointer; transition: 0.2s; text-transform: uppercase; font-weight: 700; outline: none; 
        }
        .btn-black { background: var(--muji-text); color: white; border: none; }
        .btn-toggle { background: #eee; border: 1px solid #ddd; margin-right: 5px; opacity: 0.6; }
        .btn-toggle.selected { background: var(--muji-text); color: white; opacity: 1; }
        
        .badge { background: var(--muji-accent); color: white; padding: 3px 9px; border-radius: 12px; font-size: 10px; margin-left: 5px; font-weight: 800; }

        /* SHELF */
        .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 30px; }
        .book { text-align: center; cursor: pointer; transition: transform 0.2s; -webkit-tap-highlight-color: transparent; }
        .book-cover { background: white; aspect-ratio: 3/4; border: 1.5px solid var(--muji-border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }

        /* --- FLASHCARD UPGRADED --- */
        #flashcard-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .card-item { height: 300px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card-item.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border: 1.5px solid var(--muji-border); border-radius: 20px; display: flex; align-items: center; justify-content: center; background: white; box-sizing: border-box; }
        .card-back { transform: rotateY(180deg); flex-direction: column; background: #fafaf9; padding: 25px; text-align: center; }
        
        .card-front .kanji-text { font-size: 84px; font-weight: 900; }
        .speaker-icon { position: absolute; top: 15px; right: 15px; width: 24px; height: 24px; fill: #ddd; transition: 0.2s; cursor: pointer; }
        .speaker-icon:hover { fill: var(--muji-accent); }

        /* --- PRINT SYSTEM (100% ORIGINAL) --- */
        .print-item { page-break-inside: avoid; margin-bottom: 25px; }
        .writing-line { margin-top: 10px; }
        .grid-container { display: flex; border-left: 1px solid #000; border-top: 1px solid #000; width: fit-content; }
        .writing-box { width: 55px; height: 55px; border-right: 1px solid #000; border-bottom: 1px solid #000; display: flex; align-items: center; justify-content: center; font-size: 32px; position: relative; color: #000; }
        .writing-box::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; border-top: 1px dashed #eee; }
        .writing-box::after { content: ""; position: absolute; left: 50%; top: 0; height: 100%; border-left: 1px dashed #eee; }
        .print-list-table { width: 100%; border-collapse: collapse; background: white; }
        .print-list-table th, .print-list-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .kanji-col { font-size: 24px; font-weight: 700; width: 80px; text-align: center !important; }

        @media print {
            body { background: white; padding: 0; }
            .page { display: none !important; }
            #print-page { display: block !important; width: 100%; padding: 0; margin: 0; }
            .no-print { display: none !important; }
        }

        #toast { position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 14px 35px; border-radius: 40px; font-size: 12px; transition: 0.5s; opacity: 0; z-index: 10000; }
        #toast.show { bottom: 30px; opacity: 1; }
    </style>
</head>
<body>

<div id="toast"></div>

<div id="lib-page" class="page active">
    <div class="muji-header">
        <h2>MUJI KANJI</h2>
        <div>
            <button class="btn-muji" onclick="showPage('review-page')">Sổ tay <span id="count-hard" class="badge">0</span></button>
            <button class="btn-muji btn-black" onclick="showPage('print-page')">Bản in <span id="count-print" class="badge">0</span></button>
        </div>
    </div>
    <div class="shelf" id="shelf-list"></div>
</div>

<div id="study-page" class="page">
    <button class="btn-muji" onclick="showPage('lib-page')">← Thư viện</button>
    <div style="background: white; padding: 70px 20px; border-radius: 30px; border: 1.5px solid var(--muji-border); text-align: center; margin-top: 25px;">
        <div id="sttDisplay" style="font-size: 11px; font-weight: 800; color: #ccc;">01</div>
        <div id="mainKanji" style="font-size: 130px; font-weight: 900; margin: 20px 0; color: #000;">--</div>
        <div id="info-area" style="opacity:0; transition:0.4s; margin-bottom:30px;">
            <div id="mainHanViet" style="font-family:'Montserrat',sans-serif; font-weight:900; font-size:28px; color:var(--muji-accent);"></div>
            <div id="mainNghia" style="font-weight:600; color:var(--muji-gray); font-size: 18px;"></div>
        </div>
        <input type="text" id="inputBox" placeholder="Hiragana..." autocomplete="off" style="width:220px; padding:15px; border:none; border-bottom:2px solid var(--muji-border); text-align:center; font-size:24px; outline:none; font-weight:800;">
        <div style="margin-top:45px; display:flex; gap:15px; justify-content:center;">
            <button class="btn-muji" onclick="addToPrint()">+ Bản in</button>
            <button class="btn-muji btn-black" onclick="markAsHard()">Lưu sổ tay ★</button>
        </div>
    </div>
</div>

<div id="print-page" class="page">
    <div class="muji-header no-print">
        <h3 style="font-family: 'Montserrat', sans-serif; font-weight: 900; margin:0;">BẢN IN</h3>
        <div style="display: flex; gap: 10px;">
            <div style="background: #eee; padding: 4px; border-radius: 10px;">
                <button id="toggle-writing" class="btn-muji btn-toggle selected" onclick="setPrintMode('writing')">Tập viết</button>
                <button id="toggle-list" class="btn-muji btn-toggle" onclick="setPrintMode('list')">Danh sách</button>
            </div>
            <button class="btn-muji btn-black" onclick="window.print()">In PDF</button>
            <button class="btn-muji" onclick="showPage('lib-page')">Thoát</button>
        </div>
    </div>
    <div id="print-content"></div>
</div>

<div id="review-page" class="page">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:35px;">
        <h3 style="font-family: 'Montserrat', sans-serif; font-weight: 900;">SỔ TAY</h3>
        <button class="btn-muji" onclick="showPage('lib-page')">← Quay lại</button>
    </div>
    <div id="flashcard-list"></div>
</div>

<script>
    const DATA = {
        "N5": [{ kanji: "私", hiragana: "わたし", hanviet: "TƯ", nghia: "Tôi" }, { kanji: "人", hiragana: "ひと", hanviet: "NHÂN", nghia: "Người" }],
        "N4": [{ kanji: "行", hiragana: "いく", hanviet: "HÀNH", nghia: "Đi" }, { kanji: "来", hiragana: "くる", hanviet: "LAI", nghia: "Đến" }],
        "N3": [{ kanji: "希望", hiragana: "きぼう", hanviet: "HY VỌNG", nghia: "Mong ước, kỳ vọng" }]
    };

    let printList = JSON.parse(localStorage.getItem('m_print_v4')) || [];
    let hardWords = JSON.parse(localStorage.getItem('m_hard_v4')) || [];
    let currentPrintMode = 'writing'; 
    let currentList = [];
    let currentIdx = 0;

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ja-JP';
        window.speechSynthesis.speak(msg);
    }

    function renderShelf() {
        document.getElementById('shelf-list').innerHTML = Object.keys(DATA).map(lvl => `
            <div class="book" onclick="startLearning('${lvl}')">
                <div class="book-cover">${lvl}</div>
                <p>COURSE ${lvl}</p>
            </div>
        `).join('');
    }

    function startLearning(lvl) { currentList = DATA[lvl]; currentIdx = 0; showPage('study-page'); loadWord(); }

    function loadWord() {
        const item = currentList[currentIdx];
        document.getElementById('sttDisplay').innerText = String(currentIdx + 1).padStart(2, '0');
        document.getElementById('mainKanji').innerText = item.kanji;
        document.getElementById('mainHanViet').innerText = item.hanviet;
        document.getElementById('mainNghia').innerText = item.nghia;
        document.getElementById('info-area').style.opacity = '0';
        document.getElementById('inputBox').value = "";
        document.getElementById('inputBox').focus();
    }

    document.getElementById('inputBox').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value.trim() === currentList[currentIdx].hiragana) {
            document.getElementById('info-area').style.opacity = '1';
            speak(currentList[currentIdx].kanji);
            setTimeout(() => { if (currentIdx < currentList.length - 1) { currentIdx++; loadWord(); } }, 1200);
        }
    });

    function setPrintMode(mode) {
        currentPrintMode = mode;
        document.getElementById('toggle-writing').classList.toggle('selected', mode === 'writing');
        document.getElementById('toggle-list').classList.toggle('selected', mode === 'list');
        renderPrintGrid();
    }

    function renderPrintGrid() {
        const container = document.getElementById('print-content');
        if (printList.length === 0) {
            container.innerHTML = "<p style='text-align:center; padding:60px;'>Trống.</p>";
            return;
        }

        if (currentPrintMode === 'writing') {
            container.innerHTML = printList.map((item, idx) => {
                const lines = item.kanji.split('').map(char => {
                    let boxes = `<div class="writing-box"><span>${char}</span></div>`;
                    for(let i=0; i<11; i++) boxes += `<div class="writing-box"></div>`;
                    return `<div class="writing-line"><div class="grid-container">${boxes}</div></div>`;
                }).join('');
                return `<div class="print-item">
                    <div style="border-left:4px solid var(--muji-accent); padding-left:12px; margin-bottom:10px;">
                        <b>${item.hanviet}</b> <small>(${item.hiragana} - ${item.nghia})</small>
                    </div>
                    ${lines}
                </div>`;
            }).join('');
        } else {
            let tableRows = printList.map((item, idx) => `
                <tr><td class="kanji-col">${item.kanji}</td><td><b>${item.hanviet}</b></td><td>${item.hiragana}</td><td>${item.nghia}</td><td class="no-print" onclick="removePrint(${idx})">×</td></tr>
            `).join('');
            container.innerHTML = `<table class="print-list-table"><thead><tr><th>Hán Tự</th><th>Hán Việt</th><th>Cách đọc</th><th>Ý nghĩa</th><th class="no-print">Gỡ</th></tr></thead><tbody>${tableRows}</tbody></table>`;
        }
    }

    function renderFlashcards() {
        const list = document.getElementById('flashcard-list');
        if (hardWords.length === 0) {
            list.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>Trống.</p>";
            return;
        }
        list.innerHTML = hardWords.map((w, i) => `
            <div class="card-item" onclick="this.classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="card-front">
                        <svg class="speaker-icon" onclick="event.stopPropagation(); speak('${w.kanji}')" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <div class="kanji-text">${w.kanji}</div>
                    </div>
                    <div class="card-back">
                        <div style="font-family:'Montserrat',sans-serif; font-weight:900; color:var(--muji-accent); font-size:26px;">${w.hanviet}</div>
                        <div style="font-weight:700; color:var(--muji-gray); margin:8px 0; font-size:18px;">${w.hiragana}</div>
                        <div style="font-size:16px; border-top:1.5px solid #eee; padding-top:15px; width:100%; color:#444;">${w.nghia}</div>
                        <button class="btn-muji" onclick="event.stopPropagation(); removeHard(${i})" style="margin-top:25px; border:none; color:#ccc; font-size:11px;">GỠ BỎ</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function addToPrint() {
        if(!printList.find(x => x.kanji === currentList[currentIdx].kanji)) {
            printList.push(currentList[currentIdx]); save(); showToast("Đã thêm vào bản in");
        }
    }

    function markAsHard() {
        if(!hardWords.find(w => w.kanji === currentList[currentIdx].kanji)) {
            hardWords.push(currentList[currentIdx]); save(); showToast("Đã lưu sổ tay");
        }
    }

    function removeHard(idx) { hardWords.splice(idx, 1); save(); renderFlashcards(); }
    function removePrint(idx) { printList.splice(idx, 1); save(); renderPrintGrid(); }

    function save() {
        localStorage.setItem('m_print_v4', JSON.stringify(printList));
        localStorage.setItem('m_hard_v4', JSON.stringify(hardWords));
        updateCounts();
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'review-page') renderFlashcards();
        if(id === 'print-page') renderPrintGrid();
        updateCounts();
    }

    function showToast(m) { 
        const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); 
        setTimeout(() => t.classList.remove('show'), 1500); 
    }

    function updateCounts() { 
        document.getElementById('count-hard').innerText = hardWords.length; 
        document.getElementById('count-print').innerText = printList.length; 
    }
    
    window.onload = () => { renderShelf(); updateCounts(); };
</script>
</body>
</html>
